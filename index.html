<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Путь к успеху</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЭКРАН АВТОРИЗАЦИИ (Виден по умолчанию) -->
    <div id="auth-screen" class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo-icon">🚀</div>
                <h1>Путь к успеху</h1>
                <p class="subtitle">Построй свою финансовую империю</p>
            </div>

            <!-- Форма входа -->
            <div id="login-form" class="auth-form">
                <input type="email" id="login-email" placeholder="Email" autocomplete="email">
                <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
                <button class="btn-primary" onclick="login()">Войти в игру</button>
                <p class="switch-auth" onclick="showRegister()">Нет аккаунта? <span>Создать</span></p>
            </div>

            <!-- Форма регистрации (Скрыта по умолчанию) -->
            <div id="register-form" class="auth-form" style="display: none;">
                <input type="text" id="reg-nick" placeholder="Придумайте ник (до 20 символов)" maxlength="20">
                <input type="email" id="reg-email" placeholder="Ваш Email" autocomplete="email">
                <input type="password" id="reg-password" placeholder="Придумайте пароль" autocomplete="new-password">
                <input type="password" id="reg-password-confirm" placeholder="Повторите пароль" autocomplete="new-password">
                <button class="btn-primary" onclick="register()">Начать путь</button>
                <p class="switch-auth" onclick="showLogin()">Уже есть аккаунт? <span>Войти</span></p>
            </div>
            
            <div id="auth-error" class="error-message"></div>
        </div>
    </div>

    <!-- ЭКРАН ИГРЫ (Скрыт по умолчанию через CSS) -->
    <div id="game-screen" class="game-wrapper">
        <header class="header">
            <div class="logo">🚀 Путь к успеху</div>
            <div class="balance-display">💰 <span id="usdt-display">0.00</span> USDT</div>
            <button class="btn-small" onclick="logout()">Выйти</button>
        </header>

        <main class="content">
            <!-- Здесь будут твои вкладки (home, clicker, miner и т.д.) -->
            <section id="tab-home" class="tab active">
                <h2>🏠 Главная</h2>
                <p>Добро пожаловать в игру!</p>
            </section>
            <!-- Остальные секции вкладок добавь сюда как раньше -->
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab('home')">🏠</button>
            <button class="nav-btn" onclick="switchTab('clicker')">🖱</button>
            <button class="nav-btn" onclick="switchTab('top')">🏆</button>
            <!-- Добавь остальные кнопки навигации -->
        </nav>
    </div>

    <!-- Подключение скриптов -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
